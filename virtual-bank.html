<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gringotts Virtual Bank</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-md bg-slate-900 border border-amber-500/30 rounded-3xl shadow-2xl overflow-hidden backdrop-blur-xl">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-amber-900 via-amber-800 to-yellow-900 p-6 text-center border-b border-amber-500/40">
            <h1 class="text-2xl font-bold tracking-wider text-amber-200">GRINGOTTS BANK</h1>
            <p class="text-xs text-amber-300/80 mt-1">Wizarding Virtual Financial System</p>
        </div>

        <!-- Account Card Section -->
        <div class="p-6">
            <div class="relative bg-gradient-to-br from-slate-900 via-slate-800 to-amber-950 border border-amber-500/50 rounded-2xl p-5 shadow-inner">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <span class="text-xs text-amber-400 font-medium uppercase tracking-widest">Account Name</span>
                        <div class="flex items-center gap-2 mt-1">
                            <input type="text" id="accountNameInput" value="แฮร์รี่ พอตเตอร์" 
                                class="bg-transparent text-lg font-semibold text-white border-b border-dashed border-amber-500/50 focus:outline-none focus:border-amber-400 px-1 w-48">
                            <span class="text-xs text-slate-400">(แก้ไขได้)</span>
                        </div>
                    </div>
                    <div class="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full border border-amber-500/30 font-semibold">
                        Gallon Account
                    </div>
                </div>

                <div class="mb-4">
                    <span class="text-xs text-amber-400 font-medium uppercase tracking-widest">Account Number</span>
                    <div id="accountNumberDisplay" class="text-xl font-mono tracking-widest text-slate-200 mt-0.5 font-bold">---</div>
                </div>

                <div class="pt-3 border-t border-slate-700/60 flex justify-between items-end">
                    <div>
                        <span class="text-xs text-slate-400">Balance</span>
                        <div class="text-2xl font-bold text-amber-400 mt-0.5"><span id="accountBalance">5,000</span> <span class="text-sm font-normal text-amber-300">G</span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-800 px-6">
            <button onclick="switchTab('transfer')" id="tabTransfer" class="flex-1 py-3 text-sm font-semibold text-amber-400 border-b-2 border-amber-400 transition-all cursor-pointer">โอนเงิน</button>
            <button onclick="switchTab("contacts")" id="tabContacts" class="flex-1 py-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition-all cursor-pointer">รายชื่อ</button>
        </div>

        <!-- Tab Contents -->
        <div class="p-6">
            
            <!-- Transfer Section -->
            <div id="sectionTransfer" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-medium text-slate-300">เลขบัญชีปลายทาง</label>
                    <input type="text" id="targetAccount" placeholder="กรอกเลขบัญชี 10 หลัก" maxlength="10"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition-all font-mono">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-medium text-slate-300">จำนวนเงิน (Galleon)</label>
                    <div class="relative">
                        <input type="number" id="transferAmount" placeholder="0.00"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition-all font-mono">
                        <div class="absolute right-4 top-3 text-amber-400 font-semibold">G</div>
                    </div>
                </div>

                <button onclick="handleTransfer()" class="w-full mt-2 bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition-all cursor-pointer">
                    ยืนยันการโอนเงิน
                </button>
            </div>

            <!-- Contacts Section -->
            <div id="sectionContacts" class="hidden space-y-4">
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                    <h3 class="text-xs font-semibold text-amber-400 uppercase tracking-wider">บันทึกรายชื่อใหม่</h3>
                    <input type="text" id="contactAlias" placeholder="ชื่อที่จำง่าย (เช่น ร้านไม้กายสิทธิ์ โอลิแวนเดอร์)" 
                        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    <input type="text" id="contactAccNum" placeholder="เลขบัญชี 10 หลัก" maxlength="10"
                        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500 font-mono">
                    <button onclick="saveContact()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-300 text-sm font-semibold py-2.5 rounded-xl transition-all border border-amber-500/20 cursor-pointer">
                        บันทึกรายชื่อ
                    </button>
                </div>

                <div class="space-y-2 mt-4">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">รายชื่อที่บันทึกไว้</h3>
                    <div id="contactList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <!-- Dynamic Contacts will render here -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Slip Modal -->
    <div id="slipModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-amber-500/40 w-full max-w-sm rounded-3xl p-6 shadow-2xl relative space-y-4">
            <div class="text-center border-b border-slate-800 pb-4">
                <div class="w-10 h-10 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-2 text-lg font-bold border border-amber-500/40">✓</div>
                <h2 class="text-lg font-bold text-white">โอนเงินสำเร็จ</h2>
                <p id="slipDateTime" class="text-xs text-slate-400 mt-1"></p>
            </div>

            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800/80 space-y-3 text-sm">
                <div class="flex justify-between">
                    <span class="text-slate-400 text-xs">ผู้โอน</span>
                    <span id="slipSenderName" class="font-medium text-right"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400 text-xs">เลขบัญชีผู้โอน</span>
                    <span id="slipSenderAcc" class="font-mono text-slate-300 text-xs"></span>
                </div>
                <hr class="border-slate-800">
                <div class="flex justify-between">
                    <span class="text-slate-400 text-xs">ผู้รับ</span>
                    <span id="slipReceiverName" class="font-medium text-right text-amber-300"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400 text-xs">เลขบัญชีผู้รับ</span>
                    <span id="slipReceiverAcc" class="font-mono text-slate-300 text-xs"></span>
                </div>
                <hr class="border-slate-800">
                <div class="flex justify-between items-center pt-1">
                    <span class="text-slate-400">จำนวนเงิน</span>
                    <span class="text-lg font-bold text-amber-400"><span id="slipAmount"></span> G</span>
                </div>
            </div>

            <button onclick="closeSlip()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 rounded-xl transition-all cursor-pointer">
                ปิดหน้าจอ
            </button>
        </div>
    </div>

    <script>
        // State Management
        let myAccount = {
            number: '',
            balance: 5000
        };

        let contacts = [
            { id: 1, alias: 'ร้านไม้กายสิทธิ์ โอลิแวนเดอร์', accountNumber: '1234567890' },
            { id: 2, alias: 'ร้านตัดเสื้อมาดามมัลกิ้น', accountNumber: '9876543210' }
        ];

        // Generate 10-digit random account number on load
        function initAccount() {
            let randomAcc = '';
            for (let i = 0; i < 10; i++) {
                randomAcc += Math.floor(Math.random() * 10);
            }
            myAccount.number = randomAcc;
            document.getElementById('accountNumberDisplay').innerText = formatAccNum(myAccount.number);
            renderContacts();
        }

        function formatAccNum(num) {
            return num.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
        }

        // Tab Switching Logic
        function switchTab(tab) {
            const transferSec = document.getElementById('sectionTransfer');
            const contactsSec = document.getElementById('sectionContacts');
            const tabTransfer = document.getElementById('tabTransfer');
            const tabContacts = document.getElementById('tabContacts');

            if (tab === 'transfer') {
                transferSec.classList.remove('hidden');
                contactsSec.classList.add('hidden');
                tabTransfer.className = "flex-1 py-3 text-sm font-semibold text-amber-400 border-b-2 border-amber-400 transition-all cursor-pointer";
                tabContacts.className = "flex-1 py-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition-all cursor-pointer";
            } else {
                transferSec.classList.add('hidden');
                contactsSec.classList.remove('hidden');
                tabContacts.className = "flex-1 py-3 text-sm font-semibold text-amber-400 border-b-2 border-amber-400 transition-all cursor-pointer";
                tabTransfer.className = "flex-1 py-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition-all cursor-pointer";
            }
        }

        // Render Contacts List
        function renderContacts() {
            const listContainer = document.getElementById('contactList');
            listContainer.innerHTML = '';

            if (contacts.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-2">ยังไม่มีรายชื่อที่บันทึกไว้</p>';
                return;
            }

            contacts.forEach(c => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-slate-950 border border-slate-800/80 hover:border-amber-500/30 p-3 rounded-xl transition-all group";
                item.innerHTML = `
                    <div onclick="selectContact('${c.accountNumber}')" class="flex-1 cursor-pointer">
                        <div class="text-sm font-medium text-slate-200 group-hover:text-amber-300 transition-colors">${c.alias}</div>
                        <div class="text-xs font-mono text-slate-500">${formatAccNum(c.accountNumber)}</div>
                    </div>
                    <button onclick="deleteContact(event, ${c.id})" class="text-slate-600 hover:text-red-400 text-xs px-2 py-1 transition-colors cursor-pointer" title="ลบ">✕</button>
                `;
                listContainer.appendChild(item);
            });
        }

        // Save Contact
        function saveContact() {
            const alias = document.getElementById('contactAlias').value.trim();
            const accNum = document.getElementById('contactAccNum').value.trim();

            if (!alias || !accNum) {
                alert('กรุณากรอกข้อมูลให้ครบถ้วน');
                return;
            }
            if (accNum.length !== 10) {
                alert('เลขบัญชีต้องมี 10 หลัก');
                return;
            }

            contacts.push({
                id: Date.now(),
                alias: alias,
                accountNumber: accNum
            });

            document.getElementById('contactAlias').value = '';
            document.getElementById('contactAccNum').value = '';
            renderContacts();
        }

        // Delete Contact
        function deleteContact(e, id) {
            e.stopPropagation();
            contacts = contacts.filter(c => c.id !== id);
            renderContacts();
        }

        // Select Contact to Transfer
        function selectContact(accNum) {
            document.getElementById('targetAccount').value = accNum;
            switchTab('transfer');
        }

        // Handle Transfer Process
        function handleTransfer() {
            const targetAcc = document.getElementById('targetAccount').value.trim();
            const amountInput = document.getElementById('transferAmount').value;
            const amount = parseFloat(amountInput);

            if (!targetAcc || targetAcc.length !== 10) {
                alert('กรุณากรอกเลขบัญชีปลายทางให้ถูกต้อง (10 หลัก)');
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                alert('กรุณากรอกจำนวนเงินให้ถูกต้อง');
                return;
            }
            if (amount > myAccount.balance) {
                alert('ยอดเงินในบัญชีของคุณไม่เพียงพอ');
                return;
            }

            // Deduct balance
            myAccount.balance -= amount;
            document.getElementById('accountBalance').innerText = myAccount.balance.toLocaleString();

            // Find if receiver matches any contact alias
            let receiverName = targetAcc;
            const foundContact = contacts.find(c => c.accountNumber === targetAcc);
            if (foundContact) {
                receiverName = `${foundContact.alias} (${targetAcc})`;
            } else {
                receiverName = `บัญชีปลายทาง (${formatAccNum(targetAcc)})`;
            }

            // Populate Slip
            const now = new Date();
            const dateStr = now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            document.getElementById('slipDateTime').innerText = `${dateStr} เวลา ${timeStr}`;
            document.getElementById('slipSenderName').innerText = document.getElementById('accountNameInput').value;
            document.getElementById('slipSenderAcc').innerText = formatAccNum(myAccount.number);
            document.getElementById('slipReceiverName').innerText = receiverName;
            document.getElementById('slipReceiverAcc').innerText = formatAccNum(targetAcc);
            document.getElementById('slipAmount').innerText = amount.toLocaleString();

            // Show Slip Modal
            document.getElementById('slipModal').classList.remove('hidden');
            document.getElementById('slipModal').classList.add('flex');
        }

        // Close Slip & Reset Form
        function closeSlip() {
            document.getElementById('slipModal').classList.remove('flex');
            document.getElementById('slipModal').classList.add('hidden');
            document.getElementById('targetAccount').value = '';
            document.getElementById('transferAmount').value = '';
        }

        // Initialize on load
        window.onload = initAccount;
    </script>
</body>
</html>
