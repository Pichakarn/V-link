<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual BANK - Supabase Connected</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-[#0b0714] text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#120d20] border border-purple-500/20 rounded-[2.5rem] shadow-2xl overflow-hidden backdrop-blur-2xl p-5">
        
        <!-- Top Bar -->
        <div class="flex justify-between items-center mb-5 px-1">
            <a href="home.html" class="bg-[#1b142e] border border-purple-500/20 text-slate-300 text-xs px-4 py-2 rounded-full font-medium flex items-center gap-1.5 hover:border-pink-500/40 transition-all cursor-pointer no-underline">
                <span>←</span> หน้าหลัก
            </a>
            <div class="bg-[#1b142e] border border-purple-500/20 text-pink-400 text-xs px-4 py-2 rounded-full font-bold tracking-wider">
                VIRTUAL BANK
            </div>
        </div>

        <!-- Account Info Card -->
        <div class="bg-gradient-to-br from-[#1a112d] via-[#150f24] to-[#251238] border border-purple-500/30 rounded-3xl p-5 shadow-inner mb-5 relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-pink-500/10 rounded-full blur-xl pointer-events-none"></div>

            <div class="mb-3 relative z-10 flex items-center justify-between">
                <div class="w-full">
                    <span class="text-xs text-slate-400">เจ้าของบัญชี: </span>
                    <input type="text" id="accountNameInput" onchange="updateAccountName(this.value)" 
                        class="bg-transparent text-sm font-semibold text-white border-b border-transparent hover:border-pink-500/40 focus:border-pink-500 focus:outline-none transition-all px-1 w-48 inline-block" placeholder="ชื่อบัญชี">
                </div>
            </div>

            <div class="mb-4 relative z-10">
                <span class="text-xs text-slate-400 block mb-0.5">เลขบัญชี (10 หลัก)</span>
                <div id="accountNumberDisplay" class="text-xl font-mono tracking-widest text-white font-bold">กำลังโหลด...</div>
            </div>

            <div class="relative z-10 pt-3 border-t border-purple-500/20">
                <span class="text-xs text-slate-400 block mb-0.5">ยอดเงินคงเหลือ</span>
                <div class="text-2xl font-bold text-emerald-400 flex items-baseline gap-1">
                    <span id="accountBalance">...</span> 
                    <span class="text-sm font-normal text-emerald-300">G</span>
                </div>
            </div>
        </div>

        <!-- Tab Buttons Switcher -->
        <div class="grid grid-cols-2 gap-3 mb-5">
            <button onclick="switchTab('transfer')" id="tabTransferBtn" 
                class="bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold py-3 px-4 rounded-2xl shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 text-sm transition-all cursor-pointer">
                <span>💸</span> โอนเงิน
            </button>
            <button onclick="switchTab('contacts')" id="tabContactsBtn" 
                class="bg-[#1b142e] border border-purple-500/20 text-slate-300 font-medium py-3 px-4 rounded-2xl hover:bg-[#231a3b] flex items-center justify-center gap-2 text-sm transition-all cursor-pointer">
                <span>📖</span> สมุดรายชื่อ
            </button>
        </div>

        <!-- Dynamic Content Section -->
        <div id="sectionTransfer" class="bg-[#161025] border border-purple-500/20 rounded-3xl p-5 space-y-4">
            <div class="flex items-center gap-2 text-amber-400 text-sm font-semibold">
                <span>⚡</span> ทำรายการโอนเงิน
            </div>

            <div class="space-y-1.5">
                <label class="text-xs text-slate-400 block">เลขบัญชีปลายทาง (10 หลัก)</label>
                <input type="text" id="targetAccount" placeholder="ระบุเลขบัญชี 10 หลัก" maxlength="10"
                    class="w-full bg-[#110c1c] border border-purple-500/20 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-pink-500 font-mono transition-all">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs text-slate-400 block">จำนวนเงิน (Galleon)</label>
                <div class="relative">
                    <input type="number" id="transferAmount" placeholder="0.00"
                        class="w-full bg-[#110c1c] border border-purple-500/20 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-pink-500 font-mono transition-all">
                    <div class="absolute right-4 top-3 text-emerald-400 text-sm font-bold">G</div>
                </div>
            </div>

            <button onclick="handleTransfer()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:opacity-90 text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-emerald-900/30 transition-all cursor-pointer text-sm">
                ยืนยันการโอนเงิน
            </button>
        </div>

        <!-- Contacts Section -->
        <div id="sectionContacts" class="hidden bg-[#161025] border border-purple-500/20 rounded-3xl p-5 space-y-4">
            <div class="flex items-center gap-2 text-pink-400 text-sm font-semibold">
                <span>📖</span> สมุดรายชื่อผู้ติดต่อ
            </div>

            <div class="bg-[#110c1c] p-3.5 rounded-2xl border border-purple-500/20 space-y-2.5">
                <h3 class="text-xs font-semibold text-pink-300">บันทึกรายชื่อใหม่</h3>
                <input type="text" id="contactAlias" placeholder="ชื่อที่จำได้ (เช่น เพื่อน, ร้านค้า)" 
                    class="w-full bg-[#161025] border border-purple-500/20 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
                <input type="text" id="contactAccNum" placeholder="เลขบัญชี 10 หลัก" maxlength="10"
                    class="w-full bg-[#161025] border border-purple-500/20 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-pink-500 font-mono">
                <button onclick="saveContact()" class="w-full bg-purple-600/30 hover:bg-purple-600/50 text-pink-200 text-xs font-semibold py-2 rounded-xl transition-all border border-purple-500/30 cursor-pointer">
                    บันทึกรายชื่อ
                </button>
            </div>

            <div class="space-y-2">
                <h3 class="text-xs font-semibold text-slate-400">รายชื่อที่บันทึกไว้</h3>
                <div id="contactList" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                    <!-- Dynamic Contacts -->
                </div>
            </div>
        </div>

    </div>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-[#130d22] border border-pink-500/30 w-full max-w-xs rounded-[2rem] p-6 shadow-2xl text-center space-y-4 relative">
            <div id="alertIcon" class="w-12 h-12 bg-pink-500/20 text-pink-400 border border-pink-500/30 rounded-full flex items-center justify-center mx-auto text-xl font-bold shadow-lg">⚠️</div>
            <div class="space-y-1">
                <h3 id="alertTitle" class="text-sm font-bold text-white">แจ้งเตือน</h3>
                <p id="alertMessage" class="text-xs text-slate-300 leading-relaxed"></p>
            </div>
            <button onclick="closeCustomAlert()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 text-white font-semibold py-2.5 rounded-xl transition-all cursor-pointer text-xs shadow-lg shadow-pink-900/30">
                เข้าใจแล้ว
            </button>
        </div>
    </div>

    <!-- Slip Modal -->
    <div id="slipModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-[#130d22] border border-purple-500/30 w-full max-w-sm rounded-[2rem] p-6 shadow-2xl relative space-y-5">
            <div class="text-center border-b border-purple-500/10 pb-4">
                <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full flex items-center justify-center mx-auto mb-2 text-xl font-bold shadow-lg">✓</div>
                <h2 class="text-base font-bold text-white">โอนเงินสำเร็จ</h2>
                <p id="slipDateTime" class="text-[11px] text-slate-400 mt-0.5"></p>
            </div>

            <div class="bg-[#1b122e] p-4 rounded-2xl border border-purple-500/10 space-y-3 text-xs">
                <div class="flex justify-between">
                    <span class="text-slate-400">ผู้โอน</span>
                    <span id="slipSenderName" class="font-medium text-white text-right"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">เลขบัญชีผู้โอน</span>
                    <span id="slipSenderAcc" class="font-mono text-slate-300"></span>
                </div>
                <div class="border-t border-purple-500/10 pt-2 flex justify-between">
                    <span class="text-slate-400">ผู้รับ</span>
                    <span id="slipReceiverName" class="font-medium text-pink-300 text-right"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">เลขบัญชีผู้รับ</span>
                    <span id="slipReceiverAcc" class="font-mono text-slate-300"></span>
                </div>
                <div class="border-t border-purple-500/10 pt-3 flex justify-between items-center">
                    <span class="text-slate-400">จำนวนเงิน</span>
                    <span class="text-base font-bold text-emerald-400"><span id="slipAmount"></span> G</span>
                </div>
            </div>

            <button onclick="closeSlip()" class="w-full bg-[#1b122e] hover:bg-[#231a3b] border border-purple-500/30 text-white font-semibold py-3 rounded-xl transition-all cursor-pointer text-xs">
                ปิดหน้าจอ
            </button>
        </div>
    </div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://adyyqewxqxaexwezgvqj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ueq3KXEUVLeip8dLfG4sDg_D7KLzQ1a';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentAccount = {
            id: null,
            email: '',
            account_number: '',
            account_name: '',
            balance: 0.00
        };

        let contacts = [];

        function showCustomAlert(message, title = "แจ้งเตือน", icon = "⚠️") {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            document.getElementById('alertIcon').innerText = icon;
            
            const modal = document.getElementById('customAlertModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCustomAlert() {
            const modal = document.getElementById('customAlertModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        async function initAccount() {
            let savedContacts = localStorage.getItem('virtual_bank_contacts');
            if (savedContacts) { contacts = JSON.parse(savedContacts); }

            // ดึงข้อมูลอีเมลผู้ใช้จาก localStorage ที่ระบบ Login เคยบันทึกไว้ (เช่น 'vlink_user' หรือเก็บแบบ item 'user_email')
            // ปรับชื่อคีย์ให้ตรงกับโปรเจกต์ของคุณ (ตัวอย่างนี้รองรับทั้ง vlink_user และ user_email ตรงๆ)
            let currentUserEmail = '';
            const savedUserObj = localStorage.getItem('vlink_user');
            if (savedUserObj) {
                try {
                    const parsed = JSON.parse(savedUserObj);
                    currentUserEmail = parsed.email || '';
                } catch(e) {}
            }
            if (!currentUserEmail) {
                currentUserEmail = localStorage.getItem('user_email') || '';
            }

            // ถ้าไม่มีอีเมลล็อกอิน ให้เด้งกลับไปหน้าล็อกอิน (index.html) ป้องกันการเข้าถึงผิดบัญชี
            if (!currentUserEmail) {
                showCustomAlert('ไม่พบข้อมูลการเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่อีกครั้ง', 'กรุณาล็อกอิน', '🔒');
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                return;
            }

            // ค้นหาข้อมูลบัญชีใน Supabase จาก email โดยตรง
            let { data, error } = await supabaseClient
                .from('accounts')
                .select('*')
                .eq('email', currentUserEmail)
                .maybeSingle();

            if (!data) {
                // ถ้ายังไม่มีบัญชีสำหรับอีเมลนี้ ให้สร้างเลขบัญชี 10 หลักใหม่ผูกกับอีเมลนี้ทันที
                let newAccNum = '';
                for (let i = 0; i < 10; i++) { newAccNum += Math.floor(Math.random() * 10); }

                let defaultName = currentUserEmail.split('@')[0] || "User";

                let { data: newRow, error: insertErr } = await supabaseClient
                    .from('accounts')
                    .insert([{ 
                        email: currentUserEmail, 
                        account_number: newAccNum, 
                        account_name: defaultName, 
                        balance: 100000.00 
                    }])
                    .select()
                    .single();
                
                if (insertErr) {
                    console.error('Insert Error:', insertErr);
                    showCustomAlert('ไม่สามารถสร้างบัญชีผู้ใช้ใหม่ได้', 'ข้อผิดพลาดระบบ', '❌');
                    return;
                }
                currentAccount = newRow;
            } else {
                currentAccount = data;
            }

            document.getElementById('accountNameInput').value = currentAccount.account_name;
            document.getElementById('accountNumberDisplay').innerText = formatAccNum(currentAccount.account_number);
            document.getElementById('accountBalance').innerText = parseFloat(currentAccount.balance).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

            renderContacts();
            
            // เปิดระบบ Realtime ฟังการเปลี่ยนแปลงยอดเงินตามเลขบัญชีนี้
            subscribeRealtimeBalance();
        }

        function subscribeRealtimeBalance() {
            supabaseClient
                .channel('public:accounts:' + currentAccount.account_number)
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'accounts',
                    filter: `account_number=eq.${currentAccount.account_number}`
                }, payload => {
                    if (payload.new) {
                        currentAccount.balance = payload.new.balance;
                        currentAccount.account_name = payload.new.account_name;
                        
                        document.getElementById('accountBalance').innerText = parseFloat(currentAccount.balance).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        document.getElementById('accountNameInput').value = currentAccount.account_name;
                    }
                })
                .subscribe();
        }

        async function updateAccountName(newName) {
            if (!newName.trim()) return;
            currentAccount.account_name = newName.trim();

            await supabaseClient
                .from('accounts')
                .update({ account_name: currentAccount.account_name, updated_at: new Date() })
                .eq('email', currentAccount.email);
        }

        function formatAccNum(num) {
            return num.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
        }

        function switchTab(tab) {
            const transferSec = document.getElementById('sectionTransfer');
            const contactsSec = document.getElementById('sectionContacts');
            const tabTransferBtn = document.getElementById('tabTransferBtn');
            const tabContactsBtn = document.getElementById('tabContactsBtn');

            if (tab === 'transfer') {
                transferSec.classList.remove('hidden');
                contactsSec.classList.add('hidden');
                tabTransferBtn.className = "bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold py-3 px-4 rounded-2xl shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 text-sm transition-all cursor-pointer";
                tabContactsBtn.className = "bg-[#1b142e] border border-purple-500/20 text-slate-300 font-medium py-3 px-4 rounded-2xl hover:bg-[#231a3b] flex items-center justify-center gap-2 text-sm transition-all cursor-pointer";
            } else {
                transferSec.classList.add('hidden');
                contactsSec.classList.remove('hidden');
                tabContactsBtn.className = "bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold py-3 px-4 rounded-2xl shadow-lg shadow-purple-900/30 flex items-center justify-center gap-2 text-sm transition-all cursor-pointer";
                tabTransferBtn.className = "bg-[#1b142e] border border-purple-500/20 text-slate-300 font-medium py-3 px-4 rounded-2xl hover:bg-[#231a3b] flex items-center justify-center gap-2 text-sm transition-all cursor-pointer";
            }
        }

        function renderContacts() {
            const listContainer = document.getElementById('contactList');
            listContainer.innerHTML = '';
            if (contacts.length === 0) {
                listContainer.innerHTML = '<p class="text-[11px] text-slate-500 text-center py-2">ยังไม่มีรายชื่อที่บันทึกไว้</p>';
                return;
            }
            contacts.forEach(c => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-[#161025] border border-purple-500/10 hover:border-pink-500/30 p-2.5 rounded-xl transition-all group";
                item.innerHTML = `
                    <div onclick="selectContact('${c.accountNumber}')" class="flex-1 cursor-pointer">
                        <div class="text-xs font-medium text-slate-200 group-hover:text-pink-300 transition-colors">${c.alias}</div>
                        <div class="text-[11px] font-mono text-slate-500">${formatAccNum(c.accountNumber)}</div>
                    </div>
                    <button onclick="deleteContact(event, ${c.id})" class="text-slate-500 hover:text-red-400 text-xs px-2 py-1 transition-colors cursor-pointer">✕</button>
                `;
                listContainer.appendChild(item);
            });
        }

        function saveContact() {
            const alias = document.getElementById('contactAlias').value.trim();
            const accNum = document.getElementById('contactAccNum').value.trim();
            if (!alias || !accNum) { showCustomAlert('กรุณากรอกข้อมูลให้ครบถ้วน', 'ข้อมูลไม่ครบ', '📝'); return; }
            if (accNum.length !== 10) { showCustomAlert('เลขบัญชีต้องมีความยาวครบ 10 หลัก', 'เลขบัญชีไม่ถูกต้อง', '🔢'); return; }

            contacts.push({ id: Date.now(), alias: alias, accountNumber: accNum });
            localStorage.setItem('virtual_bank_contacts', JSON.stringify(contacts));
            document.getElementById('contactAlias').value = '';
            document.getElementById('contactAccNum').value = '';
            renderContacts();
        }

        function deleteContact(e, id) {
            e.stopPropagation();
            contacts = contacts.filter(c => c.id !== id);
            localStorage.setItem('virtual_bank_contacts', JSON.stringify(contacts));
            renderContacts();
        }

        function selectContact(accNum) {
            document.getElementById('targetAccount').value = accNum;
            switchTab('transfer');
        }

        async function handleTransfer() {
            const targetAcc = document.getElementById('targetAccount').value.trim();
            const amountInput = document.getElementById('transferAmount').value;
            const amount = parseFloat(amountInput);

            if (!targetAcc || targetAcc.length !== 10) { showCustomAlert('กรุณากรอกเลขบัญชีปลายทางให้ถูกต้อง (10 หลัก)', 'ตรวจสอบเลขบัญชี', '🔍'); return; }
            if (targetAcc === currentAccount.account_number) { showCustomAlert('ไม่สามารถโอนเงินเข้าบัญชีตนเองได้นะ', 'ทำรายการไม่สำเร็จ', '😅'); return; }
            if (isNaN(amount) || amount <= 0) { showCustomAlert('กรุณากรอกจำนวนเงินให้ถูกต้อง', 'จำนวนเงินไม่ถูกต้อง', '💸'); return; }
            if (amount > currentAccount.balance) { showCustomAlert('ยอดเงินในบัญชีของคุณไม่เพียงพอสำหรับการโอนครั้งนี้', 'ยอดเงินไม่พอ', '💳'); return; }

            let { data: receiverData, error: findErr } = await supabaseClient
                .from('accounts')
                .select('*')
                .eq('account_number', targetAcc)
                .single();

            if (!receiverData) {
                showCustomAlert('ไม่พบเลขบัญชีปลายทางนี้ในระบบฐานข้อมูล', 'ไม่พบผู้รับ', '🔍');
                return;
            }

            let newSenderBalance = parseFloat(currentAccount.balance) - amount;
            let newReceiverBalance = parseFloat(receiverData.balance) + amount;

            let { error: updateSenderErr } = await supabaseClient
                .from('accounts')
                .update({ balance: newSenderBalance, updated_at: new Date() })
                .eq('account_number', currentAccount.account_number);

            if (updateSenderErr) {
                showCustomAlert('เกิดข้อผิดพลาดในการหักเงิน กรุณาลองใหม่อีกครั้ง', 'ระบบขัดข้อง', '❌');
                return;
            }

            await supabaseClient
                .from('accounts')
                .update({ balance: newReceiverBalance, updated_at: new Date() })
                .eq('account_number', targetAcc);

            currentAccount.balance = newSenderBalance;
            document.getElementById('accountBalance').innerText = currentAccount.balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

            let receiverDisplayName = receiverData.account_name;

            const now = new Date();
            const dateStr = now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            document.getElementById('slipDateTime').innerText = `${dateStr} เวลา ${timeStr}`;
            document.getElementById('slipSenderName').innerText = currentAccount.account_name;
            document.getElementById('slipSenderAcc').innerText = formatAccNum(currentAccount.account_number);
            document.getElementById('slipReceiverName').innerText = receiverDisplayName;
            document.getElementById('slipReceiverAcc').innerText = formatAccNum(targetAcc);
            document.getElementById('slipAmount').innerText = amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

            document.getElementById('slipModal').classList.remove('hidden');
            document.getElementById('slipModal').classList.add('flex');
        }

        function closeSlip() {
            document.getElementById('slipModal').classList.remove('flex');
            document.getElementById('slipModal').classList.add('hidden');
            document.getElementById('targetAccount').value = '';
            document.getElementById('transferAmount').value = '';
        }

        window.onload = initAccount;
    </script>
</body>
</html>
