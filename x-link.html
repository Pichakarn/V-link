<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-link (Twitter Simulation)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #000; color: #e7e9ea; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- Main Container -->
    <div class="w-full max-w-xl min-h-screen bg-black border-x border-neutral-800 flex flex-col justify-between pb-16">
        
        <!-- Header -->
        <header class="sticky top-0 z-20 bg-black/85 backdrop-blur-md border-b border-neutral-800 px-4 py-3 flex justify-between items-center">
            <h1 id="header-title" class="text-xl font-bold">หน้าหลัก</h1>
        </header>

        <!-- Content Area (Tabs) -->
        <main class="flex-1 overflow-y-auto">
            
            <!-- 1) TAB: หน้าหลัก (Home) -->
            <div id="tab-home" class="tab-content">
                <!-- โพสต์บ็อกซ์ -->
                <div class="border-b border-neutral-800 p-4 flex gap-3">
                    <div class="w-10 h-10 rounded-full bg-sky-600 flex items-center justify-center font-bold text-white shrink-0 overflow-hidden" id="current-user-avatar-container">
                        <span id="current-user-avatar">U</span>
                    </div>
                    <div class="flex-1">
                        <textarea id="post-input" rows="3" placeholder="เกิดอะไรขึ้นบ้าง?" class="w-full bg-transparent text-white placeholder-neutral-500 focus:outline-none resize-none"></textarea>
                        
                        <!-- พรีวิวรูปภาพ -->
                        <div id="image-preview-container" class="hidden relative mb-2">
                            <img id="image-preview" src="" alt="Preview" class="max-h-60 rounded-xl object-cover w-full">
                            <button onclick="removeImage()" class="absolute top-2 right-2 bg-black/70 text-white rounded-full w-7 h-7 flex items-center justify-center hover:bg-black"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <div class="flex justify-between items-center pt-2 border-t border-neutral-800/60">
                            <label class="cursor-pointer text-sky-500 hover:text-sky-400 p-2">
                                <i class="fa-regular fa-image text-lg"></i>
                                <input type="file" id="image-file-input" accept="image/*" class="hidden" onchange="previewImage(event)">
                            </label>
                            <button onclick="createPost()" class="bg-sky-500 hover:bg-sky-600 text-white font-bold px-4 py-1.5 rounded-full text-sm transition">โพสต์</button>
                        </div>
                    </div>
                </div>

                <!-- ฟีดโพสต์ -->
                <div id="posts-feed" class="divide-y divide-neutral-800">
                    <div class="p-8 text-center text-neutral-500">กำลังโหลดโพสต์...</div>
                </div>
            </div>

            <!-- 2) TAB: หน้าค้นหา (Explore) -->
            <div id="tab-explore" class="tab-content hidden p-4">
                <div class="relative mb-4">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-neutral-500"></i>
                    <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="ค้นหาแอคเคาท์ (@username) หรือแฮชแท็ก" class="w-full bg-neutral-900 text-white pl-11 pr-4 py-2.5 rounded-full focus:outline-none focus:ring-1 focus:ring-sky-500 placeholder-neutral-500 text-sm">
                </div>

                <!-- ผลลัพธ์การค้นหาแอคเคาท์ -->
                <div id="account-search-results" class="mb-6 hidden">
                    <h3 class="text-sm font-semibold text-neutral-400 mb-2">บัญชีผู้ใช้และเอเจนซี่</h3>
                    <div id="account-list" class="space-y-2"></div>
                </div>

                <!-- เทรนด์ # ยอดนิยม 10 อันดับ -->
                <div>
                    <h3 class="text-lg font-bold mb-3">10 อันดับ # ยอดนิยมในช่วงนี้</h3>
                    <div id="trending-hashtags" class="space-y-3"></div>
                </div>
                
                <!-- โพสต์ตามแฮชแท็กที่กดเลือก -->
                <div id="hashtag-posts-section" class="mt-6 hidden">
                    <div class="flex justify-between items-center mb-3">
                        <h3 id="active-hashtag-title" class="text-md font-bold text-sky-400">#Hashtag</h3>
                        <button onclick="closeHashtagPosts()" class="text-xs text-neutral-400 hover:text-white">ปิด</button>
                    </div>
                    <div id="hashtag-posts-feed" class="divide-y divide-neutral-800 border-t border-neutral-800"></div>
                </div>
            </div>

            <!-- 3) TAB: โปรไฟล์ (Profile) -->
            <div id="tab-profile" class="tab-content hidden">
                <div class="h-32 bg-neutral-800"></div>
                <div class="px-4 pb-4 border-b border-neutral-800 relative">
                    <div class="flex justify-between items-end -mt-10 mb-3">
                        <div class="w-20 h-20 rounded-full bg-sky-600 border-4 border-black flex items-center justify-center text-2xl font-bold text-white overflow-hidden" id="profile-avatar-container">
                            <span id="profile-avatar">U</span>
                        </div>
                        <button onclick="openEditProfileModal()" class="border border-neutral-700 text-white text-xs font-bold px-4 py-1.5 rounded-full hover:bg-neutral-900 transition">แก้ไขโปรไฟล์</button>
                    </div>
                    <div>
                        <h2 id="profile-name" class="text-lg font-bold">ชื่อผู้ใช้</h2>
                        <p id="profile-username" class="text-sm text-neutral-500">@username</p>
                    </div>
                    <div class="flex gap-4 mt-3 text-sm">
                        <div><span id="profile-following-count" class="font-bold text-white">0</span> <span class="text-neutral-500 cursor-pointer hover:underline" onclick="openFollowingModal()">กำลังติดตาม</span></div>
                        <div><span id="profile-followers-count" class="font-bold text-white">0</span> <span class="text-neutral-500">ผู้ติดตาม</span></div>
                    </div>
                </div>

                <!-- หมวดย่อยโปรไฟล์ -->
                <div class="flex border-b border-neutral-800 text-sm font-semibold">
                    <button onclick="switchProfileTab('posts')" id="btn-sub-posts" class="flex-1 py-3 text-center border-b-2 border-sky-500 text-white">โพสต์ของฉัน</button>
                    <button onclick="switchProfileTab('likes')" id="btn-sub-likes" class="flex-1 py-3 text-center border-b-2 border-transparent text-neutral-500 hover:text-white">โพสต์ที่ถูกใจ</button>
                </div>

                <div id="profile-posts-feed" class="divide-y divide-neutral-800"></div>
            </div>

        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 w-full max-w-xl bg-black/90 backdrop-blur-md border-t border-neutral-800 flex justify-around py-3 z-30">
            <button onclick="switchTab('home')" id="nav-home" class="text-sky-500 text-xl"><i class="fa-solid fa-house"></i></button>
            <button onclick="switchTab('explore')" id="nav-explore" class="text-neutral-500 text-xl"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button onclick="switchTab('profile')" id="nav-profile" class="text-neutral-500 text-xl"><i class="fa-solid fa-user"></i></button>
        </nav>

    </div>

    <!-- Modal: แก้ไขโปรไฟล์ -->
    <div id="edit-profile-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-neutral-900 border border-neutral-800 w-full max-w-md rounded-2xl overflow-hidden p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-white">แก้ไขโปรไฟล์</h3>
                <button onclick="closeEditProfileModal()" class="text-neutral-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div class="flex flex-col items-center mb-4">
                    <label class="relative cursor-pointer group">
                        <div class="w-20 h-20 rounded-full bg-sky-600 flex items-center justify-center text-2xl font-bold text-white overflow-hidden border-2 border-neutral-700" id="edit-avatar-preview-container">
                            <span id="edit-avatar-preview-text">U</span>
                            <img id="edit-avatar-preview-img" src="" class="w-full h-full object-cover hidden">
                        </div>
                        <div id="avatar-loading-overlay" class="absolute inset-0 bg-black/60 rounded-full flex items-center justify-center hidden">
                            <i class="fa-solid fa-spinner fa-spin text-white text-xl"></i>
                        </div>
                        <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                            <i class="fa-solid fa-camera text-white text-lg"></i>
                        </div>
                        <input type="file" id="edit-avatar-file-input" accept="image/*" class="hidden" onchange="previewAvatarImage(event)">
                    </label>
                    <span id="avatar-status-text" class="text-xs text-neutral-400 mt-1">แตะเพื่อเปลี่ยนรูปโปรไฟล์</span>
                </div>

                <div>
                    <label class="block text-xs text-neutral-400 mb-1">ชื่อที่แสดง</label>
                    <input type="text" id="edit-name-input" class="w-full bg-neutral-800 text-white px-3 py-2 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-sky-500">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 mb-1">ยูสเซอร์เนม (@username)</label>
                    <input type="text" id="edit-username-input" class="w-full bg-neutral-800 text-white px-3 py-2 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-sky-500">
                </div>
                <button id="save-profile-btn" onclick="saveProfileChanges()" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 rounded-xl text-sm transition mt-2">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>

    <!-- Modal: รายชื่อกำลังติดตาม -->
    <div id="following-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-neutral-900 border border-neutral-800 w-full max-w-md rounded-2xl overflow-hidden max-h-[80vh] flex flex-col">
            <div class="p-4 border-b border-neutral-800 flex justify-between items-center">
                <h3 class="font-bold">กำลังติดตาม</h3>
                <button onclick="closeFollowingModal()" class="text-neutral-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="following-list" class="overflow-y-auto p-4 divide-y divide-neutral-800 space-y-3"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://adyyqewxqxaexwezgvqj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ueq3KXEUVLeip8dLfG4sDg_D7KLzQ1a';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const CLOUDINARY_UPLOAD_PRESET = 'V-link';
        const CLOUDINARY_CLOUD_NAME = 'ncpkgyfz';

        let currentUser = {
            account_number: '', 
            username: 'user',
            name: 'User',
            account_type: 'user',
            avatar_url: ''
        };

        let uploadedImageUrl = '';
        let uploadedAvatarUrl = '';
        let isUploadingAvatar = false;
        let allPosts = [];
        let accountProfiles = {}; 

        function initUserSession() {
            // สร้างรหัสบัญชีเฉพาะตัวสำหรับอุปกรณ์นี้โดยเฉพาะ (แยกเครื่องใครเครื่องมันเด็ดขาด 100%)
            let deviceAccountNumber = localStorage.getItem('unique_device_account_number');
            
            if (!deviceAccountNumber) {
                deviceAccountNumber = 'ACC_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
                localStorage.setItem('unique_device_account_number', deviceAccountNumber);
            }
            currentUser.account_number = deviceAccountNumber;
            
            // โหลดโปรไฟล์เฉพาะของเครื่องนี้จาก LocalStorage ก่อนเพื่อความรวดเร็ว
            const savedProfile = localStorage.getItem(`profile_data_${deviceAccountNumber}`);
            if (savedProfile) {
                const parsed = JSON.parse(savedProfile);
                currentUser.name = parsed.name || currentUser.name;
                currentUser.username = parsed.username || currentUser.username;
                currentUser.avatar_url = parsed.avatar_url || currentUser.avatar_url;
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            initUserSession();
            await fetchProfileFromDatabase();
            await fetchPosts();
            await loadFollowersData();
            loadTrendingHashtags();
        });

        // ดึงข้อมูลโปรไฟล์เฉพาะของ account_number นี้จากฐานข้อมูลโดยตรง
        async function fetchProfileFromDatabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('x_link_all')
                    .select('name, username, account_type, avatar_url')
                    .eq('account_number', currentUser.account_number)
                    .order('created_at', { ascending: false })
                    .limit(1);

                if (!error && data && data.length > 0) {
                    const latest = data[0];
                    if (latest.name) currentUser.name = latest.name;
                    if (latest.username) currentUser.username = latest.username;
                    if (latest.account_type) currentUser.account_type = latest.account_type;
                    if (latest.avatar_url) {
                        currentUser.avatar_url = latest.avatar_url;
                    }
                    saveLocalProfile();
                }
            } catch (err) {
                console.error('Error fetching direct profile:', err);
            }
            updateUserUI();
        }

        function saveLocalProfile() {
            localStorage.setItem(`profile_data_${currentUser.account_number}`, JSON.stringify({
                name: currentUser.name,
                username: currentUser.username,
                avatar_url: currentUser.avatar_url
            }));
        }

        function processAccountProfiles() {
            accountProfiles = {};
            // จัดเก็บข้อมูลโปรไฟล์ของแต่ละ account_number แยกออกจากกันอย่างเด็ดขาด
            allPosts.forEach(post => {
                if (post.account_number) {
                    if (!accountProfiles[post.account_number] || new Date(post.created_at) > new Date(accountProfiles[post.account_number].created_at)) {
                        accountProfiles[post.account_number] = {
                            name: post.name || 'User',
                            username: post.username || 'username',
                            account_type: post.account_type || 'user',
                            avatar_url: post.avatar_url || '',
                            created_at: post.created_at
                        };
                    }
                }
            });

            // อัปเดตข้อมูลของตัวเองให้ตรงกับฐานข้อมูลล่าสุดของเลขบัญชีนี้
            if (accountProfiles[currentUser.account_number]) {
                currentUser.name = accountProfiles[currentUser.account_number].name;
                currentUser.username = accountProfiles[currentUser.account_number].username;
                if (accountProfiles[currentUser.account_number].avatar_url) {
                    currentUser.avatar_url = accountProfiles[currentUser.account_number].avatar_url;
                }
                saveLocalProfile();
            }
            updateUserUI();
        }

        function updateUserUI() {
            ['current-user-avatar', 'profile-avatar'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const parent = el.parentElement;
                
                if (currentUser.avatar_url) {
                    parent.innerHTML = `<img src="${currentUser.avatar_url}" class="w-full h-full object-cover">`;
                } else {
                    parent.innerHTML = `<span id="${id}">${currentUser.name.charAt(0).toUpperCase()}</span>`;
                }
            });

            document.getElementById('profile-name').innerText = currentUser.name;
            document.getElementById('profile-username').innerText = '@' + currentUser.username;
        }

        async function loadFollowersData() {
            try {
                const { data, error } = await supabaseClient
                    .from('followers')
                    .select('xlink_followers')
                    .eq('account_number', currentUser.account_number)
                    .maybeSingle();

                if (data && data.xlink_followers !== undefined) {
                    document.getElementById('profile-followers-count').innerText = data.xlink_followers.toLocaleString();
                } else {
                    document.getElementById('profile-followers-count').innerText = '0';
                }
            } catch (err) {
                console.error("Error loading followers:", err);
            }
        }

        function switchTab(tabName) {
            ['home', 'explore', 'profile'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('text-sky-500');
                document.getElementById(`nav-${t}`).classList.add('text-neutral-500');
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).classList.remove('text-neutral-500');
            document.getElementById(`nav-${tabName}`).classList.add('text-sky-500');

            const titles = { home: 'หน้าหลัก', explore: 'สำรวจและค้นหา', profile: 'โปรไฟล์ของฉัน' };
            document.getElementById('header-title').innerText = titles[tabName];

            if (tabName === 'profile') {
                loadProfilePosts('posts');
                loadFollowersData();
            }
        }

        async function fetchPosts() {
            try {
                const { data, error } = await supabaseClient
                    .from('x_link_all')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) throw error;
                allPosts = data || [];
                processAccountProfiles();
                renderPosts([...allPosts].reverse(), 'posts-feed');
                loadTrendingHashtags();
            } catch (err) {
                console.error('Error fetching posts:', err);
                document.getElementById('posts-feed').innerHTML = '<div class="p-8 text-center text-neutral-500">ไม่สามารถโหลดข้อมูลโพสต์ได้</div>';
            }
        }

        function renderPosts(posts, containerId) {
            const container = document.getElementById(containerId);
            if (!posts.length) {
                container.innerHTML = '<div class="p-8 text-center text-neutral-500">ยังไม่มีโพสต์ในขณะนี้</div>';
                return;
            }

            container.innerHTML = posts.map(post => {
                let displayName = post.name || 'User';
                let displayUsername = post.username || 'username';
                let displayAvatar = post.avatar_url || '';

                // ใช้ข้อมูลโปรไฟล์ล่าสุดตามเลขบัญชีของเจ้าของโพสต์นั้นๆ โดยเฉพาะ
                if (accountProfiles[post.account_number]) {
                    displayName = accountProfiles[post.account_number].name;
                    displayUsername = accountProfiles[post.account_number].username;
                    displayAvatar = accountProfiles[post.account_number].avatar_url || '';
                }

                if (post.post_content && post.post_content.includes('🔄 อัปเดตข้อมูลโปรไฟล์')) {
                    return '';
                }

                const avatarContent = displayAvatar 
                    ? `<img src="${displayAvatar}" class="w-full h-full object-cover">`
                    : displayName.charAt(0).toUpperCase();

                return `
                    <div class="p-4 border-b border-neutral-800 hover:bg-neutral-950/40 transition">
                        <div class="flex gap-3">
                            <div class="w-10 h-10 rounded-full bg-neutral-700 flex items-center justify-center font-bold text-white shrink-0 overflow-hidden">
                                ${avatarContent}
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center gap-1.5">
                                    <span class="font-bold text-white text-sm">${displayName}</span>
                                    <span class="text-neutral-500 text-xs">@${displayUsername}</span>
                                    <span class="text-neutral-600 text-xs">• ${timeAgo(post.created_at)}</span>
                                </div>
                                <p class="text-sm text-neutral-200 mt-1 whitespace-pre-wrap">${formatHashtags(post.post_content)}</p>
                                
                                ${post.post_image_url ? `<img src="${post.post_image_url}" class="mt-3 rounded-2xl max-h-80 w-full object-cover border border-neutral-800">` : ''}

                                <div class="flex justify-between max-w-xs mt-3 text-neutral-500 text-sm">
                                    <button onclick="handleLike(${post.id}, ${post.liked_by_me})" class="flex items-center gap-1.5 hover:text-pink-500 transition ${post.liked_by_me ? 'text-pink-500' : ''}">
                                        <i class="${post.liked_by_me ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                                        <span>${post.likes_count || 0}</span>
                                    </button>
                                    <button onclick="handleRepost(${post.id})" class="flex items-center gap-1.5 hover:text-green-500 transition">
                                        <i class="fa-regular fa-retweet"></i>
                                        <span>${post.reposts_count || 0}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
                uploadToCloudinary(file, 'post');
            }
        }

        function previewAvatarImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgEl = document.getElementById('edit-avatar-preview-img');
                    const txtEl = document.getElementById('edit-avatar-preview-text');
                    imgEl.src = e.target.result;
                    imgEl.classList.remove('hidden');
                    txtEl.classList.add('hidden');
                }
                reader.readAsDataURL(file);
                uploadAvatarToCloudinary(file);
            }
        }

        async function uploadAvatarToCloudinary(file) {
            isUploadingAvatar = true;
            document.getElementById('avatar-loading-overlay').classList.remove('hidden');
            document.getElementById('avatar-status-text').innerText = 'กำลังอัปโหลดรูป...';
            document.getElementById('save-profile-btn').disabled = true;
            document.getElementById('save-profile-btn').classList.add('opacity-50');

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.secure_url) {
                    uploadedAvatarUrl = data.secure_url;
                    document.getElementById('avatar-status-text').innerText = 'อัปโหลดรูปสำเร็จ!';
                }
            } catch (err) {
                console.error('Cloudinary upload error:', err);
                document.getElementById('avatar-status-text').innerText = 'อัปโหลดรูปไม่สำเร็จ';
            } finally {
                isUploadingAvatar = false;
                document.getElementById('avatar-loading-overlay').classList.add('hidden');
                document.getElementById('save-profile-btn').disabled = false;
                document.getElementById('save-profile-btn').classList.remove('opacity-50');
            }
        }

        async function uploadToCloudinary(file, type) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.secure_url && type === 'post') {
                    uploadedImageUrl = data.secure_url;
                }
            } catch (err) {
                console.error('Cloudinary upload error:', err);
            }
        }

        function removeImage() {
            uploadedImageUrl = '';
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('image-file-input').value = '';
        }

        async function createPost() {
            const content = document.getElementById('post-input').value.trim();
            if (!content && !uploadedImageUrl) return alert('กรุณาพิมพ์ข้อความหรือใส่รูปภาพ');

            const hashtags = extractHashtags(content);
            const newPost = {
                account_number: currentUser.account_number,
                username: currentUser.username,
                name: currentUser.name,
                account_type: currentUser.account_type,
                avatar_url: currentUser.avatar_url || null,
                post_content: content,
                post_image_url: uploadedImageUrl || null,
                likes_count: 0,
                reposts_count: 0,
                liked_by_me: false,
                hashtag_name: hashtags.length > 0 ? hashtags[0] : null,
                hashtag_usage_count: 1,
                created_at: new Date().toISOString()
            };

            try {
                const { error } = await supabaseClient.from('x_link_all').insert([newPost]);
                if (error) throw error;

                document.getElementById('post-input').value = '';
                removeImage();
                fetchPosts();
            } catch (err) {
                console.error('Error creating post:', err);
                alert('เกิดข้อผิดพลาดในการโพสต์');
            }
        }

        async function handleLike(postId, currentLikedState) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;

            const newLikedState = !currentLikedState;
            const newLikesCount = newLikedState ? (post.likes_count + 1) : Math.max(0, post.likes_count - 1);

            try {
                await supabaseClient.from('x_link_all')
                    .update({ liked_by_me: newLikedState, likes_count: newLikesCount })
                    .eq('id', postId);

                post.liked_by_me = newLikedState;
                post.likes_count = newLikesCount;
                renderPosts([...allPosts].reverse(), 'posts-feed');
            } catch (err) {
                console.error('Error updating like:', err);
            }
        }

        async function handleRepost(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;

            try {
                const newRepostsCount = (post.reposts_count || 0) + 1;
                await supabaseClient.from('x_link_all')
                    .update({ reposts_count: newRepostsCount })
                    .eq('id', postId);

                post.reposts_count = newRepostsCount;
                renderPosts([...allPosts].reverse(), 'posts-feed');
                alert('รีโพสต์สำเร็จ!');
            } catch (err) {
                console.error('Error reposting:', err);
            }
        }

        function handleSearch(query) {
            query = query.trim();
            if (!query) {
                document.getElementById('account-search-results').classList.add('hidden');
                return;
            }

            if (query.startsWith('@')) {
                const keyword = query.substring(1).toLowerCase();
                const uniqueAccounts = Object.values(accountProfiles).filter(acc => 
                    acc.username.toLowerCase().includes(keyword) || acc.name.toLowerCase().includes(keyword)
                );

                const accountListEl = document.getElementById('account-list');
                if (uniqueAccounts.length > 0) {
                    accountListEl.innerHTML = uniqueAccounts.map(acc => `
                        <div class="flex items-center justify-between bg-neutral-900 p-3 rounded-xl">
                            <div>
                                <p class="font-bold text-sm text-white">${acc.name}</p>
                                <p class="text-xs text-neutral-500">@${acc.username} (${acc.account_type})</p>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('account-search-results').classList.remove('hidden');
                } else {
                    accountListEl.innerHTML = '<div class="text-xs text-neutral-500 p-2">ไม่พบแอคเคาท์นี้</div>';
                    document.getElementById('account-search-results').classList.remove('hidden');
                }
            } else {
                document.getElementById('account-search-results').classList.add('hidden');
            }
        }

        function loadTrendingHashtags() {
            const hashtagCounts = {};
            allPosts.forEach(post => {
                if (post.hashtag_name) {
                    hashtagCounts[post.hashtag_name] = (hashtagCounts[post.hashtag_name] || 0) + (post.hashtag_usage_count || 1);
                }
            });

            const sortedHashtags = Object.entries(hashtagCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const container = document.getElementById('trending-hashtags');
            if (sortedHashtags.length === 0) {
                container.innerHTML = '<p class="text-sm text-neutral-500">ยังไม่มีแฮชแท็กที่เป็นกระแสในขณะนี้</p>';
                return;
            }

            container.innerHTML = sortedHashtags.map(([tag, count], index) => `
                <div onclick="filterByHashtag('${tag}')" class="bg-neutral-900 p-3 rounded-xl cursor-pointer hover:bg-neutral-800 transition flex justify-between items-center">
                    <div>
                        <span class="text-xs text-neutral-500">อันดับที่ ${index + 1} • กำลังเป็นกระแส</span>
                        <p class="font-bold text-sky-400">#${tag}</p>
                    </div>
                    <span class="text-xs text-neutral-500">${count} โพสต์</span>
                </div>
            `).join('');
        }

        function filterByHashtag(tag) {
            const filtered = allPosts.filter(p => p.hashtag_name === tag);
            document.getElementById('active-hashtag-title').innerText = `#${tag}`;
            renderPosts([...filtered].reverse(), 'hashtag-posts-feed');
            document.getElementById('hashtag-posts-section').classList.remove('hidden');
        }

        function closeHashtagPosts() {
            document.getElementById('hashtag-posts-section').classList.add('hidden');
        }

        function openEditProfileModal() {
            document.getElementById('edit-name-input').value = currentUser.name;
            document.getElementById('edit-username-input').value = currentUser.username;
            
            const imgEl = document.getElementById('edit-avatar-preview-img');
            const txtEl = document.getElementById('edit-avatar-preview-text');
            
            if (currentUser.avatar_url) {
                imgEl.src = currentUser.avatar_url;
                imgEl.classList.remove('hidden');
                txtEl.classList.add('hidden');
            } else {
                imgEl.classList.add('hidden');
                txtEl.classList.remove('hidden');
                txtEl.innerText = currentUser.name.charAt(0).toUpperCase();
            }

            uploadedAvatarUrl = currentUser.avatar_url || '';
            document.getElementById('avatar-status-text').innerText = 'แตะเพื่อเปลี่ยนรูปโปรไฟล์';
            document.getElementById('edit-profile-modal').classList.remove('hidden');
        }

        function closeEditProfileModal() {
            document.getElementById('edit-profile-modal').classList.add('hidden');
        }

        async function saveProfileChanges() {
            if (isUploadingAvatar) {
                alert('กรุณารอสักครู่ กำลังอัปโหลดรูปโปรไฟล์');
                return;
            }

            const newName = document.getElementById('edit-name-input').value.trim();
            const newUsername = document.getElementById('edit-username-input').value.trim();

            if (!newName || !newUsername) {
                alert('กรุณากรอกข้อมูลให้ครบถ้วน');
                return;
            }

            currentUser.name = newName;
            currentUser.username = newUsername;

            let finalAvatarUrl = currentUser.avatar_url;
            if (uploadedAvatarUrl) {
                finalAvatarUrl = uploadedAvatarUrl;
                currentUser.avatar_url = uploadedAvatarUrl;
            }

            saveLocalProfile();
            updateUserUI();
            closeEditProfileModal();

            try {
                const profileUpdateRecord = {
                    account_number: currentUser.account_number,
                    username: newUsername,
                    name: newName,
                    account_type: currentUser.account_type,
                    avatar_url: finalAvatarUrl || null,
                    post_content: '🔄 อัปเดตข้อมูลโปรไฟล์',
                    likes_count: 0,
                    reposts_count: 0,
                    liked_by_me: false,
                    created_at: new Date().toISOString()
                };

                const { error } = await supabaseClient.from('x_link_all').insert([profileUpdateRecord]);
                if (error) throw error;

                fetchPosts();
                alert('อัปเดตโปรไฟล์สำเร็จ!');
            } catch (err) {
                console.error('Error updating profile:', err);
                alert('เกิดข้อผิดพลาดในการบันทึกโปรไฟล์');
            }
        }

        function switchProfileTab(subTab) {
            const btnPosts = document.getElementById('btn-sub-posts');
            const btnLikes = document.getElementById('btn-sub-likes');

            if (subTab === 'posts') {
                btnPosts.className = "flex-1 py-3 text-center border-b-2 border-sky-500 text-white";
                btnLikes.className = "flex-1 py-3 text-center border-b-2 border-transparent text-neutral-500 hover:text-white";
                loadProfilePosts('posts');
            } else {
                btnLikes.className = "flex-1 py-3 text-center border-b-2 border-sky-500 text-white";
                btnPosts.className = "flex-1 py-3 text-center border-b-2 border-transparent text-neutral-500 hover:text-white";
                loadProfilePosts('likes');
            }
        }

        function loadProfilePosts(type) {
            if (type === 'posts') {
                const myPosts = allPosts.filter(p => p.account_number === currentUser.account_number && (!p.post_content || !p.post_content.includes('🔄 อัปเดตข้อมูลโปรไฟล์')));
                renderPosts([...myPosts].reverse(), 'profile-posts-feed');
            } else {
                const likedPosts = allPosts.filter(p => p.liked_by_me === true);
                renderPosts([...likedPosts].reverse(), 'profile-posts-feed');
            }
        }

        async function openFollowingModal() {
            const modal = document.getElementById('following-modal');
            const listEl = document.getElementById('following-list');
            modal.classList.remove('hidden');

            const followedAccounts = allPosts.filter(p => p.account_number !== currentUser.account_number);
            const uniqueFollowedAccNums = Array.from(new Set(followedAccounts.map(p => p.account_number)));

            if (uniqueFollowedAccNums.length === 0) {
                listEl.innerHTML = '<p class="text-sm text-neutral-500 text-center py-4">คุณยังไม่ได้ติดตามใคร</p>';
                return;
            }

            listEl.innerHTML = uniqueFollowedAccNums.map(accNum => {
                const accInfo = accountProfiles[accNum] || { name: 'User', username: 'username' };
                return `
                    <div class="flex items-center justify-between py-2">
                        <div>
                            <p class="font-bold text-sm text-white">${accInfo.name}</p>
                            <p class="text-xs text-neutral-500">@${accInfo.username}</p>
                        </div>
                        <span class="text-xs bg-neutral-800 text-neutral-300 px-3 py-1 rounded-full">กำลังติดตาม</span>
                    </div>
                `;
            }).join('');
        }

        function closeFollowingModal() {
            document.getElementById('following-modal').classList.add('hidden');
        }

        function extractHashtags(text) {
            const matches = text.match(/#([a-zA-Z0-9ก-๙]+)/g);
            return matches ? matches.map(tag => tag.substring(1)) : [];
        }

        function formatHashtags(text) {
            if (!text) return '';
            return text.replace(/#([a-zA-Z0-9ก-๙]+)/g, '<span class="text-sky-400">#$1</span>');
        }

        function timeAgo(dateString) {
            const date = new Date(dateString);
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return `${seconds} วินาทีที่แล้ว`;
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} นาทีที่แล้ว`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ชั่วโมงที่แล้ว`;
            return `${Math.floor(hours / 24)} วันที่แล้ว`;
        }
    </script>
</body>
