<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Link - หน้าหลักมือถือ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome สำหรับไอคอนแอปพลิเคชันและสภาพอากาศ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- กรอบโทรศัพท์มือถือ (Phone Frame) -->
    <div class="w-full max-w-sm h-screen sm:h-[844px] bg-slate-900 sm:border-8 sm:border-slate-800 sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative">
        
        <!-- Status Bar ด้านบน (นาฬิกา & Role) -->
        <div class="px-6 pt-4 pb-2 flex justify-between items-center text-xs font-medium text-slate-400 bg-slate-900/80 backdrop-blur-md z-10">
            <div id="real-time-clock" class="text-slate-200 font-semibold">00:00</div>
            <div class="flex items-center gap-2">
                <span class="bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded-full uppercase tracking-wider text-[10px] border border-rose-500/30" id="user-role-badge">User</span>
                <button onclick="logout()" title="ออกจากระบบ" class="text-slate-400 hover:text-rose-400 cursor-pointer"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>

        <!-- หน้าจอหลัก (Home Screen - App Grid) -->
        <div class="flex-1 overflow-y-auto px-6 py-3 space-y-5">
            
            <!-- การ์ดแสดง วัน วันที่ เดือน และสภาพอากาศ (Weather & Date Widget) -->
            <div class="bg-gradient-to-r from-slate-800/80 to-slate-800/40 border border-slate-700/60 p-4 rounded-2xl backdrop-blur flex justify-between items-center shadow-lg">
                <div class="space-y-0.5">
                    <p id="current-date-text" class="text-xs font-medium text-rose-400 tracking-wide">กำลังโหลดวันที่...</p>
                    <h2 id="current-day-text" class="text-lg font-bold text-white">---</h2>
                </div>
                <div class="flex items-center gap-3 bg-slate-900/60 px-3.5 py-2 rounded-xl border border-slate-700/50">
                    <div id="weather-icon" class="text-amber-400 text-xl">
                        <i class="fa-solid fa-cloud-sun"></i>
                    </div>
                    <div class="text-right">
                        <div id="weather-temp" class="text-sm font-bold text-white">32°C</div>
                        <div id="weather-condition" class="text-[10px] text-slate-400">มีเมฆบางส่วน</div>
                    </div>
                </div>
            </div>

            <!-- ตารางรวมแอปพลิเคชัน (Grid App Icons แสดงแถวละ 3 อัน) -->
            <div>
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">แอปพลิเคชันทั้งหมด</h3>
                
                <div class="grid grid-cols-3 gap-5 text-center">
                    
                    <!-- S-link -->
                    <a href="s-link.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-brands fa-instagram"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">S-link</span>
                    </a>

                    <!-- X-link -->
                    <a href="x-link.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-slate-950 border border-slate-700 flex items-center justify-center text-white text-lg shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-x"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">X-link</span>
                    </a>

                    <!-- U-link -->
                    <a href="u-link.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-red-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-play"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">U-link</span>
                    </a>

                    <!-- Board -->
                    <a href="board.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-amber-500 flex items-center justify-center text-slate-950 text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">Board</span>
                    </a>

                    <!-- Profile -->
                    <a href="profile.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-emerald-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-id-badge"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">Profile</span>
                    </a>

                    <!-- Bank -->
                    <a href="virtual-bank.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">Bank</span>
                    </a>

                    <!-- Store -->
                    <a href="store.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-violet-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-bag-shopping"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">Store</span>
                    </a>

                    <!-- Agency (แสดงเฉพาะ Admin หรือ User ที่ได้ Role Agency) -->
                    <a id="app-agency" href="agency.html" class="hidden group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-purple-900 border border-purple-500 flex items-center justify-center text-purple-200 text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-building-columns"></i>
                        </div>
                        <span class="text-[11px] text-purple-300 font-medium">Agency</span>
                    </a>

                    <!-- Admin (แสดงเฉพาะ Admin เท่านั้น) -->
                    <a id="app-admin" href="admin.html" class="hidden group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-rose-900 border border-rose-500 flex items-center justify-center text-rose-200 text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <span class="text-[11px] text-rose-300 font-medium">Admin</span>
                    </a>

                </div>
            </div>

        </div>

        <!-- Home Bar ด้านล่างสไตล์มือถือ -->
        <div class="py-2 bg-slate-900 flex justify-center items-center">
            <div class="w-32 h-1 bg-slate-700 rounded-full"></div>
        </div>

    </div>

    <!-- Custom Alert Modal (ป๊อปอัพแจ้งเตือนดีไซน์น่ารัก) -->
    <div id="customAlertModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-rose-500/30 w-full max-w-xs rounded-[2rem] p-6 shadow-2xl text-center space-y-4 relative">
            <div id="alertIcon" class="w-12 h-12 bg-rose-500/25 text-rose-400 border border-rose-500/30 rounded-full flex items-center justify-center mx-auto text-xl font-bold shadow-lg">⚠️</div>
            <div class="space-y-1">
                <h3 id="alertTitle" class="text-sm font-bold text-white">แจ้งเตือน</h3>
                <p id="alertMessage" class="text-xs text-slate-300 leading-relaxed"></p>
            </div>
            <button onclick="closeCustomAlert()" class="w-full bg-gradient-to-r from-rose-600 to-purple-600 hover:opacity-90 text-white font-semibold py-2.5 rounded-xl transition-all cursor-pointer text-xs shadow-lg shadow-rose-900/30">
                เข้าใจแล้ว
            </button>
        </div>
    </div>

    <!-- Script ควบคุมเวลา วันที่ สภาพอากาศ และสิทธิ์ Role -->
    <script>
        // ฟังก์ชันเรียกแสดงป๊อปอัพแจ้งเตือน
        function showCustomAlert(message, title = "แจ้งเตือน", icon = "⚠️") {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            document.getElementById('alertIcon').innerText = icon;
            
            const modal = document.getElementById('customAlertModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCustomAlert() {
            const modal = document.getElementById('customAlertModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        // ระบบนาฬิกาเรียลไทม์ และอัปเดตวัน/เวลา
        function updateDateTime() {
            const now = new Date();
            
            // อัปเดตเวลา Status Bar
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('real-time-clock').innerText = `${hours}:${minutes}`;

            // อัปเดตแสดงผล วัน / วันที่ / เดือน (ภาษาไทย)
            const optionsDay = { weekday: 'long' };
            const optionsDate = { day: 'numeric', month: 'long', year: 'numeric' };
            
            const dayString = now.toLocaleDateString('th-TH', optionsDay); // เช่น วันเสาร์
            const dateString = now.toLocaleDateString('th-TH', optionsDate); // เช่น 29 สิงหาคม 2569

            document.getElementById('current-day-text').innerText = dayString;
            document.getElementById('current-date-text').innerText = dateString;
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();

        // จำลองข้อมูลสภาพอากาศ
        function loadWeatherInfo() {
            document.getElementById('weather-temp').innerText = "32°C";
            document.getElementById('weather-condition').innerText = "มีเมฆบางส่วน";
        }
        loadWeatherInfo();

        // ตรวจสอบข้อมูลผู้ใช้จาก localStorage ที่ได้ล็อกอินไว้
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('vlink_user');
            
            if (!savedUser) {
                // ถ้ายังไม่ล็อกอิน ให้แสดงป๊อปอัพเตือนก่อนเด้งกลับไปหน้า index.html
                showCustomAlert('กรุณาเข้าสู่ระบบก่อนใช้งาน', 'ยังไม่ได้เข้าสู่ระบบ', '🔒');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);
                return;
            }

            const user = JSON.parse(savedUser);
            document.getElementById('user-role-badge').innerText = user.role;

            // จัดการสิทธิ์การมองเห็นแอป Agency และ Admin
            const agencyApp = document.getElementById('app-agency');
            const adminApp = document.getElementById('app-admin');

            if (user.role === 'admin') {
                agencyApp.classList.remove('hidden');
                adminApp.classList.remove('hidden');
            } else if (user.role === 'agency') {
                agencyApp.classList.remove('hidden');
            }
        });

        // ฟังก์ชันออกจากระบบ
        function logout() {
            localStorage.removeItem('vlink_user');
            showCustomAlert('ออกจากระบบเรียบร้อยแล้ว', 'ลาก่อย', '👋');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        }
    </script>
</body>
</html>
