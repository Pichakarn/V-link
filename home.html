<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Link - หน้าหลักมือถือ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome สำหรับไอคอนแอปพลิเคชัน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- กรอบโทรศัพท์มือถือ (Phone Frame) -->
    <div class="w-full max-w-sm h-screen sm:h-[844px] bg-slate-900 sm:border-8 sm:border-slate-800 sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative">
        
        <!-- Status Bar ด้านบน (นาฬิกา & Role) -->
        <div class="px-6 pt-4 pb-2 flex justify-between items-center text-xs font-medium text-slate-400 bg-slate-900/80 backdrop-blur-md z-10">
            <div id="real-time-clock" class="text-slate-200 font-semibold">00:00</div>
            <div class="flex items-center gap-2">
                <span class="bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded-full uppercase tracking-wider text-[10px] border border-rose-500/30" id="user-role-badge">User</span>
                <button onclick="logout()" title="ออกจากระบบ" class="text-slate-400 hover:text-rose-400"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>

        <!-- หน้าจอหลัก (Home Screen - App Grid) -->
        <div class="flex-1 overflow-y-auto px-6 py-4 space-y-6">
            
            <!-- ส่วนต้อนรับผู้ใช้ -->
            <div class="flex items-center justify-between bg-slate-800/40 border border-slate-800 p-4 rounded-2xl backdrop-blur">
                <div>
                    <p class="text-xs text-slate-400">ยินดีต้อนรับกลับมา,</p>
                    <h2 id="user-name-display" class="text-lg font-bold text-white truncate max-w-[180px]">User</h2>
                </div>
                <div class="w-10 h-10 rounded-full bg-rose-600/30 border border-rose-500 flex items-center justify-center text-rose-400 font-bold">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <!-- ตารางรวมแอปพลิเคชัน (Grid App Icons) -->
            <div>
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">แอปพลิเคชันทั้งหมด</h3>
                
                <div class="grid grid-cols-4 gap-4 text-center">
                    
                    <!-- S-link -->
                    <a href="s-link.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-brands fa-instagram"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">S-link</span>
                    </a>

                    <!-- X-link -->
                    <a href="x-link.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-slate-950 border border-slate-700 flex items-center justify-center text-white text-lg shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-x"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">X-link</span>
                    </a>

                    <!-- U-link -->
                    <a href="u-link.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-red-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-play"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">U-link</span>
                    </a>

                    <!-- Board -->
                    <a href="board.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-amber-500 flex items-center justify-center text-slate-950 text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">Board</span>
                    </a>

                    <!-- Profile -->
                    <a href="profile.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-emerald-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-id-badge"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">Profile</span>
                    </a>

                    <!-- Bank -->
                    <a href="virtual-bank.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">Bank</span>
                    </a>

                    <!-- Store -->
                    <a href="store.html" class="group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-violet-600 flex items-center justify-center text-white text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-bag-shopping"></i>
                        </div>
                        <span class="text-[11px] text-slate-300 font-medium">Store</span>
                    </a>

                    <!-- Agency (แสดงเฉพาะ Admin หรือ User ที่ได้ Role Agency) -->
                    <a id="app-agency" href="agency.html" class="hidden group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-purple-900 border border-purple-500 flex items-center justify-center text-purple-200 text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-building-columns"></i>
                        </div>
                        <span class="text-[11px] text-purple-300 font-medium">Agency</span>
                    </a>

                    <!-- Admin (แสดงเฉพาะ Admin เท่านั้น) -->
                    <a id="app-admin" href="admin.html" class="hidden group flex flex-col items-center space-y-1.5">
                        <div class="w-14 h-14 rounded-2xl bg-rose-900 border border-rose-500 flex items-center justify-center text-rose-200 text-xl shadow-lg group-hover:scale-105 transition-all">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <span class="text-[11px] text-rose-300 font-medium">Admin</span>
                    </a>

                </div>
            </div>

        </div>

        <!-- Home Bar ด้านล่างสไตล์มือถือ -->
        <div class="py-2 bg-slate-900 flex justify-center items-center">
            <div class="w-32 h-1 bg-slate-700 rounded-full"></div>
        </div>

    </div>

    <!-- Script ควบคุมเวลาและการแสดงผลตามสิทธิ์ (Role) -->
    <script>
        // ระบบนาฬิกาเรียลไทม์
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('real-time-clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ตรวจสอบข้อมูลผู้ใช้จาก localStorage ที่ได้ล็อกอินไว้
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('vlink_user');
            
            if (!savedUser) {
                // ถ้ายังไม่ล็อกอิน ให้เด้งกลับไปหน้า index.html
                window.location.href = 'index.html';
                return;
            }

            const user = JSON.parse(savedUser);
            document.getElementById('user-name-display').innerText = user.name || user.email.split('@')[0];
            document.getElementById('user-role-badge').innerText = user.role;

            // จัดการสิทธิ์การมองเห็นแอป Agency และ Admin
            const agencyApp = document.getElementById('app-agency');
            const adminApp = document.getElementById('app-admin');

            if (user.role === 'admin') {
                agencyApp.classList.remove('hidden');
                adminApp.classList.remove('hidden');
            } else if (user.role === 'agency') {
                agencyApp.classList.remove('hidden');
            }
        });

        // ฟังก์ชันออกจากระบบ
        function logout() {
            localStorage.removeItem('vlink_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
